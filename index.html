<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>링크 보관함</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="링크보관함">
<style>
:root{--bg:#111318;--card:#1b1f29;--line:#2a3040;--tx:#e8ecf4;--sub:#8b94a8;--ac:#7cc4ff;--ok:#6fd49a;--warn:#f0b35a;--bad:#ff7b7b}
@media (prefers-color-scheme: light){:root{--bg:#f4f6fa;--card:#fff;--line:#dde2ec;--tx:#1a2030;--sub:#6a7388;--ac:#1d7fd6;--ok:#1f9a5a;--warn:#c27a10;--bad:#d03a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.wrap{max-width:680px;margin:0 auto;padding:14px 0 70px}
h1{font-size:19px;margin:6px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
textarea,input[type=text],input[type=email],input[type=password]{width:100%;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{min-height:70px;resize:vertical}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#06121f;font-weight:700}
button.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--sub);font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--ac);border-color:var(--ac);color:#06121f;font-weight:600}
.sub{color:var(--sub);font-size:13px}
.hide{display:none!important}
#msg{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:648px;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:none;z-index:30}

/* 폴더 격자 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.folder{border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:var(--bg)}
.folder:active{opacity:.7}
.folder .fi{font-size:26px}
.folder .fn{font-weight:700;margin-top:2px;word-break:break-all}
.folder .fc{color:var(--sub);font-size:12px}
.folder .fp{margin-top:6px;font-size:12px;color:var(--sub)}
.folder.dashed{border-style:dashed;display:flex;align-items:center;justify-content:center;color:var(--sub);min-height:92px}

/* 목록 */
.item{display:flex;gap:10px;border-top:1px solid var(--line);padding:12px 0}
.item:first-child{border-top:0}
.thumb{flex:0 0 56px;height:56px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;background:#333;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 6px;border-radius:6px}
.p-youtube{background:#c4302b}.p-tiktok{background:#111;box-shadow:inset 3px 0 #25f4ee,inset -3px 0 #fe2c55}.p-xhs{background:#ff2442}.p-etc{background:#556}
.body{flex:1;min-width:0}
.item a.u{color:var(--ac);text-decoration:none;word-break:break-all;display:block;margin:4px 0}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600;white-space:nowrap}
.st-new{color:var(--warn)}.st-working{color:var(--ac)}.st-done{color:var(--ok)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.item .acts button{padding:4px 9px;font-size:13px}
.embed.tt{width:192px;height:340px;max-width:100%;display:block;margin:0 auto 8px}
.vid{width:auto;max-width:100%;max-height:340px;background:#000;border-radius:10px;display:block;margin:0 auto 8px}
.content{flex:1;min-width:0}
.thumb.wide{display:block;width:100%;height:auto;aspect-ratio:16/9;flex:none;border-radius:10px;margin-bottom:8px}
.thumb.wide img{height:100%}
.thumb.wide.short{width:192px;height:340px;aspect-ratio:auto;margin:0 auto 8px}
.thumb.wide .play{right:8px;bottom:8px;font-size:13px;padding:3px 10px}
.embed{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:8px;background:#000}

/* 선택 */
.ck{width:22px;height:22px;flex:0 0 auto;margin-top:2px;accent-color:var(--ac)}
.item.sel{background:rgba(124,196,255,.10);border-radius:10px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15;display:none}
#bar .in{max-width:680px;margin:0 auto}
#bar button{padding:7px 10px;font-size:13px}
body.hasbar .wrap{padding-bottom:150px}
body.hasbar #msg{bottom:calc(120px + env(safe-area-inset-bottom))}

/* 폴더 꾹 누르기 */
.folder{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.folder.fsel{outline:2px solid var(--ac)}
.fck{position:absolute;top:8px;right:8px;margin:0}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.menu button{text-align:left;padding:12px}
#fbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15;display:none}
#fbar .in{max-width:680px;margin:0 auto}

/* 폴더 끌어서 옮기기 */
.folder.armed{transform:scale(.96);outline:2px solid var(--ac)}
.folder.dragging{opacity:.35}
.folder.drop-in{outline:2px dashed var(--ok);background:rgba(111,212,154,.18)}
.folder.drop-before{box-shadow:-6px 0 0 var(--ac)}
.folder.drop-after{box-shadow:6px 0 0 var(--ac)}
#ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:scale(1.03);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#upZone{position:fixed;top:0;left:0;right:0;padding:16px;text-align:center;background:var(--ac);color:#06121f;font-weight:700;z-index:40;display:none}
#upZone.over{background:var(--ok)}
.pathrow{display:flex;gap:6px}

/* 모달 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;width:100%;max-width:420px;max-height:80vh;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">🔗 링크 보관함</h1>

  <div id="setup" class="card hide">
    <b>설정이 비어 있어요</b>
    <p class="sub">config.js 에 Supabase URL 과 anon 키를 채운 뒤 다시 올려주세요.</p>
  </div>

  <div id="login" class="card hide">
    <b>로그인</b>
    <div class="row" style="margin-top:10px;flex-direction:column;align-items:stretch">
      <input id="em" type="email" placeholder="이메일" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label class="sub"><input type="checkbox" id="showPw"> 비밀번호 보기</label>
      <button class="pri" id="btnLogin">로그인</button>
    </div>
  </div>

  <!-- 홈: 저장 + 폴더 -->
  <div id="home" class="hide">
    <div class="card">
      <textarea id="inp" placeholder="링크(또는 공유 문구 통째로)를 붙여넣으세요. 여러 개도 돼요."></textarea>
      <div class="row" style="margin-top:8px">
        <button id="btnPaste">📋 붙여넣기</button>
        <span class="sub" id="found"></span>
      </div>
      <div class="sub" style="margin-top:10px">카테고리 (여러 개 선택 가능)</div>
      <div class="chips" id="pickCats"></div>
      <input id="memo" type="text" placeholder="메모 (선택)">
      <div class="row" style="margin-top:10px"><button class="pri" id="btnSave">저장</button></div>
    </div>

    <div class="card">
      <div class="row" style="margin-bottom:10px">
        <input id="q" type="text" class="grow" placeholder="전체 검색 (링크·메모)">
      </div>
      <div class="grid" id="folders"></div>
      <div class="sub" style="margin-top:10px">💡 폴더를 꾹 누르면 메뉴가 열려요. 꾹 누른 채 끌면 다른 폴더 안으로 넣거나 순서를 바꿀 수 있어요.</div>
    </div>

    <div class="row">
      <button id="btnExportAll">📊 전체 엑셀로 내보내기</button>
      <button id="btnOut" class="sub">로그아웃</button>
    </div>
    <div class="sub" id="diag" style="margin-top:14px;word-break:break-all;opacity:.7"></div>
  </div>

  <!-- 폴더 -->
  <div id="folder" class="hide">
    <div class="row" style="margin-bottom:10px">
      <button id="btnBack">← 폴더</button>
      <span class="grow"></span>
      <button id="btnExport">📊 엑셀</button>
      <button id="btnRenFolder">✏️ 이름 변경</button>
      <button id="btnDelFolder" class="bad">폴더 삭제</button>
    </div>
    <div class="card hide" id="subCard">
      <div class="grid" id="subfolders"></div>
      <div class="sub" style="margin-top:10px">💡 폴더를 꾹 누른 채 끌면: 다른 폴더 위에 놓기=그 안으로 · 왼쪽/오른쪽 끝에 놓기=순서 바꾸기 · 위쪽 띠에 놓기=한 단계 위로</div>
    </div>
    <div class="card">
      <div class="row">
        <input id="addUrl" type="text" class="grow" placeholder="이 폴더에 링크 추가 (붙여넣기)">
        <button class="pri" id="btnAdd">추가</button>
      </div>
    </div>
    <div class="card">
      <input id="fq" type="text" placeholder="이 폴더에서 검색">
      <label class="sub" style="display:flex;gap:8px;align-items:center;margin-top:10px;cursor:pointer"><input type="checkbox" id="autoEmbed" class="ck" style="margin:0"> 영상 바로 보이기 (스크롤하면 불러와요)</label>
      <div class="chips" id="platFilter"></div>
      <div class="row" id="statusFilter"></div>
      <label class="row sub" style="margin-top:8px;cursor:pointer"><input type="checkbox" class="ck" id="selAll" style="margin:0"> 이 목록 전체 선택 <span id="selCnt"></span></label>
      <div id="list" style="margin-top:6px"></div>
    </div>
  </div>
</div>
<div id="bar"><div class="in">
  <div class="sub" id="barInfo" style="margin-bottom:6px"></div>
  <div class="row">
    <button class="pri" id="bXls">📊 엑셀</button>
    <button id="bShare">📤 링크 보내기</button>
    <button id="bCopy">📋 복사</button>
    <button id="bMove">📁 폴더</button>
    <button id="bStatus">상태</button>
    <button id="bDel" class="bad">삭제</button>
    <button id="bClear">해제</button>
  </div>
</div></div>
<div id="fbar"><div class="in">
  <div class="sub" id="fbarInfo" style="margin-bottom:6px"></div>
  <div class="row">
    <button class="pri" id="fXls">📊 엑셀</button>
    <button id="fAll">전체 선택</button>
    <button id="fDel" class="bad">삭제</button>
    <button id="fClear">해제</button>
  </div>
</div></div>
<div id="upZone"></div>
<div id="msg"></div>
<div id="modal" class="hide"><div class="box" id="modalBox"></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const cfg = window.LINKBOX_CONFIG || {};
// 공유로 들어온 값은 페이지가 뜨자마자 먼저 붙잡아 둔다(로그인 화면을 거쳐도 잃지 않게).
const SHARE = (()=>{
  const p = new URLSearchParams(location.search);
  const v = [p.get("title"),p.get("text"),p.get("url")].filter(Boolean).join("\n");
  if(v){ try{ localStorage.setItem("pendingShare", v); }catch{} }
  return v;
})();
// 진단: 앱(TWA)으로 열렸는지, 공유 값이 도착했는지 보여 준다.
const DIAG = (()=>{
  const ref = document.referrer || "(없음)";
  const app = ref.startsWith("android-app://") ? "앱(인증됨)" : "브라우저 창(인증 안 됨?)";
  const mode = matchMedia("(display-mode: standalone)").matches ? "standalone" : "browser";
  return `진단 · 열린 방식: ${app} · 표시: ${mode} · 출처: ${ref} · 받은 주소 값: ${location.search ? location.search.slice(0,120) : "(없음)"} · 버전 v7`;
})();
let sb, cats = [], links = [];
let pick = new Set(), fStatus = "all", fPlat = "all";
let authed = false;
const sel = new Set();
const fsel = new Set();   // 선택한 폴더(카테고리) id
let curRows = [];

const PLAT = {
  youtube:{name:"유튜브", icon:"▶"},
  tiktok:{name:"틱톡", icon:"♪"},
  xhs:{name:"샤오홍슈", icon:"📕"},
  etc:{name:"기타", icon:"🔗"}
};
const BADGE_BG = {youtube:"#c4302b", tiktok:"#111", xhs:"#ff2442", etc:"#667"};
const STATUS = {new:"대기", working:"작업 중", done:"완료"};

function toast(t){const m=$("msg");m.textContent=t;m.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display="none",3000);}
const esc = (s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function platformOf(u){
  let h=""; try{h=new URL(u).hostname.toLowerCase();}catch{}
  if(/(^|\.)(tiktok\.com)$/.test(h)) return "tiktok";
  if(/(^|\.)(xiaohongshu\.com|xhslink\.com)$/.test(h)) return "xhs";
  if(/(^|\.)(youtube\.com|youtu\.be)$/.test(h)) return "youtube";
  return "etc";
}
function youtubeId(u){
  try{
    const x=new URL(u), h=x.hostname.replace(/^www\.|^m\./,"");
    if(h==="youtu.be") return x.pathname.slice(1).split("/")[0]||null;
    if(h.endsWith("youtube.com")){
      if(x.searchParams.get("v")) return x.searchParams.get("v");
      const m=x.pathname.match(/^\/(shorts|embed|live)\/([\w-]{6,})/); if(m) return m[2];
    }
  }catch{}
  return null;
}
function extractUrls(text){
  const m = (text||"").match(/https?:\/\/[^\s<>"'，。！）)\]]+/g) || [];
  const out=[]; for(let u of m){ u=u.replace(/[.,;!?，。]+$/,""); if(!out.includes(u)) out.push(u); }
  return out;
}
function shortUrl(u){ try{const x=new URL(u);return x.hostname.replace(/^www\./,"")+x.pathname.replace(/\/$/,"")+(x.search?"…":"");}catch{return u;} }

/* ---------- 라우팅: #f=이름 | #all | #none | (홈) ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("f=")) return {t:"cat", name:h.slice(2)};
  if(h==="all") return {t:"all"};
  if(h==="none") return {t:"none"};
  return {t:"home"};
}
function go(h){ sel.clear(); fsel.clear(); if(!h){ history.pushState(null,"",location.pathname); render(); } else { location.hash = encodeURIComponent(h); } }
window.addEventListener("hashchange", ()=>{ fStatus="all"; fPlat="all"; sel.clear(); fsel.clear(); render(); });
window.addEventListener("popstate", render);

/* ---------- 초기화 / 로그인 ---------- */
async function init(){
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY){ $("setup").classList.remove("hide"); return; }
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
  const {data} = await sb.auth.getSession();
  if(data.session) await enter(); else $("login").classList.remove("hide");
}
async function enter(){
  authed = true;
  $("login").classList.add("hide");
  let shared = SHARE;
  if(!shared){ try{ shared = localStorage.getItem("pendingShare") || ""; }catch{} }
  if(shared){
    // 공유로 들어오면 항상 홈(저장 화면)으로
    if(location.hash) history.replaceState(null,"",location.pathname);
    $("inp").value = shared;
    try{ localStorage.removeItem("pendingShare"); }catch{}
    if(location.search) history.replaceState(null,"",location.pathname);
    updateFound();
    const n = extractUrls(shared).length;
    toast(n ? `공유받은 링크 ${n}개를 채웠어요. 카테고리를 고르고 저장하세요.` : "공유받은 내용에 링크가 없어요.");
  } else if(location.search){
    $("found").textContent = "받은 값: " + decodeURIComponent(location.search).slice(0,160);
  }
  await loadAll();
}
$("btnLogin").onclick = async ()=>{
  const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim().toLowerCase(),password:$("pw").value.trim()});
  if(error) return toast("로그인 실패: "+error.message);
  await enter();
};
$("showPw").onchange=(e)=>{$("pw").type=e.target.checked?"text":"password";};
$("btnOut").onclick = async ()=>{ await sb.auth.signOut(); location.reload(); };

async function loadAll(){
  const [c,l] = await Promise.all([
    sb.from("categories").select("*").order("sort").order("id"),
    sb.from("links").select("*").order("created_at",{ascending:false}).limit(2000)
  ]);
  if(c.error||l.error) return toast("불러오기 실패: "+(c.error||l.error).message);
  cats=c.data; links=l.data; render();
}

/* ---------- 렌더 ---------- */
function chip(label,on,fn){
  const e=document.createElement("span"); e.className="chip"+(on?" on":""); e.textContent=label; e.onclick=fn; return e;
}
function render(){
  if(!authed) return;
  const r = route();
  $("home").classList.toggle("hide", r.t!=="home");
  $("folder").classList.toggle("hide", r.t==="home");
  if(r.t==="home") renderHome();
  else renderFolder(r);
}

function platMarks(list){
  const c={}; list.forEach(l=>c[l.platform]=(c[l.platform]||0)+1);
  return Object.keys(PLAT).filter(k=>c[k]).map(k=>`${PLAT[k].icon}${c[k]}`).join(" ");
}

/* ---------- 폴더 경로: "영화/미드" = 영화 폴더 안의 미드 폴더 ---------- */
const parentOf = (p)=>{ const i=p.lastIndexOf("/"); return i<0 ? "" : p.slice(0,i); };
const leafOf = (p)=>p.slice(p.lastIndexOf("/")+1);
const inPath = (name,p)=> name===p || name.startsWith(p+"/");
const catRow = (p)=>cats.find(c=>c.name===p);
const linksIn = (p)=>links.filter(l=>l.categories.some(c=>inPath(c,p)));
function childrenOf(parent){
  const pre = parent ? parent+"/" : "";
  const map = new Map();
  cats.forEach(c=>{
    if(!c.name.startsWith(pre)) return;
    const seg = c.name.slice(pre.length).split("/")[0]; if(!seg) return;
    const path = pre+seg, own = catRow(path);
    const cur = map.get(path);
    if(!cur) map.set(path,{path,key:own?own.sort:c.sort,id:own?own.id:c.id,own:!!own});
    else if(!cur.own && own){ cur.key=own.sort; cur.id=own.id; cur.own=true; }
    else if(!cur.own && c.sort<cur.key){ cur.key=c.sort; }
  });
  return [...map.values()].sort((x,y)=>x.key-y.key||x.id-y.id).map(x=>x.path);
}

function platMarks(list){
  const c={}; list.forEach(l=>c[l.platform]=(c[l.platform]||0)+1);
  return Object.keys(PLAT).filter(k=>c[k]).map(k=>`${PLAT[k].icon}${c[k]}`).join(" ");
}

function folderGrid(container, parent){
  childrenOf(parent).forEach(path=>{
    const row=catRow(path), list=linksIn(path), subN=childrenOf(path).length;
    const d=document.createElement("div"); d.className="folder"+(row&&fsel.has(row.id)?" fsel":""); d.dataset.path=path;
    const ck = row && fsel.size ? `<input type="checkbox" class="ck fck" ${fsel.has(row.id)?"checked":""} tabindex="-1">` : "";
    d.innerHTML=`${ck}<div class="fi">${subN?"📂":"📁"}</div><div class="fn">${esc(leafOf(path))}</div><div class="fc">${list.length}개${subN?` · 하위 ${subN}`:""}</div><div class="fp">${platMarks(list)||"&nbsp;"}</div>`;
    attachPress(d, path, ()=>{ const r2=catRow(path); if(r2 && fsel.size) toggleF(r2.id); else go("f="+path); });
    container.append(d);
  });
}
function plainCard(icon,name,list,onclick){
  const d=document.createElement("div"); d.className="folder";
  d.innerHTML=`<div class="fi">${icon}</div><div class="fn">${esc(name)}</div><div class="fc">${list.length}개</div><div class="fp">${platMarks(list)||"&nbsp;"}</div>`;
  d.onclick=onclick; return d;
}

function renderHome(){
  $("title").textContent = "🔗 링크 보관함";
  const pc=$("pickCats"); pc.innerHTML="";
  cats.forEach(c=>pc.append(chip(c.name,pick.has(c.name),()=>{pick.has(c.name)?pick.delete(c.name):pick.add(c.name);renderHome();})));
  pc.append(chip("＋ 새 카테고리",false,()=>addCategory("")));

  const g=$("folders"); g.innerHTML="";
  const q=$("q").value.trim().toLowerCase();
  if(q){
    const rows=links.filter(l=>(l.url+" "+l.memo+" "+l.title).toLowerCase().includes(q));
    g.innerHTML = `<div class="sub" style="grid-column:1/-1">'${esc(q)}' 검색 결과 ${rows.length}개 — 아래 폴더를 눌러 열면 그 안에서 볼 수 있어요.</div>`;

  syncFBar();
  $("diag").textContent = DIAG;
}

function folderRows(r){
  if(r.t==="cat") return linksIn(r.name);
  if(r.t==="none") return links.filter(l=>!l.categories.length);
  return links;
}
function folderLabel(r){ return r.t==="cat" ? r.name.split("/").join(" › ") : r.t==="none" ? "미분류" : "전체"; }

function renderFolder(r){
  const base = folderRows(r);
  $("title").textContent = (r.t==="all"?"🗂️ ":r.t==="none"?"📄 ":"📁 ")+folderLabel(r)+` (${base.length})`;
  $("btnDelFolder").classList.toggle("hide", r.t!=="cat");
  $("btnRenFolder").classList.toggle("hide", r.t!=="cat");
  $("addUrl").placeholder = r.t==="cat" ? `'${r.name}' 폴더에 링크 추가 (붙여넣기)` : "링크 추가 (붙여넣기)";
  const parent = r.t==="cat" ? parentOf(r.name) : "";
  $("btnBack").textContent = parent ? "← "+leafOf(parent) : "← 폴더";
  $("subCard").classList.toggle("hide", r.t!=="cat");
  if(r.t==="cat"){
    const sg=$("subfolders"); sg.innerHTML="";
    folderGrid(sg, r.name);
    const add=document.createElement("div"); add.className="folder dashed"; add.textContent="＋ 하위 폴더"; add.onclick=()=>addCategory(r.name); sg.append(add);
  }

  const pf=$("platFilter"); pf.innerHTML="";
  pf.append(chip("전체 "+base.length,fPlat==="all",()=>{fPlat="all";render();}));
  Object.keys(PLAT).forEach(k=>{
    const n=base.filter(l=>l.platform===k).length;
    if(n) pf.append(chip(`${PLAT[k].icon} ${PLAT[k].name} ${n}`,fPlat===k,()=>{fPlat=k;render();}));
  });
  const sf=$("statusFilter"); sf.innerHTML="";
  [["all","전체"],["new","대기"],["working","작업 중"],["done","완료"]].forEach(([k,t])=>
    sf.append(chip(t,fStatus===k,()=>{fStatus=k;render();})));

  const q=$("fq").value.trim().toLowerCase();
  const rows=base.filter(l=>
    (fPlat==="all"||l.platform===fPlat) && (fStatus==="all"||l.status===fStatus) &&
    (!q || (l.url+" "+l.memo+" "+l.title).toLowerCase().includes(q)));
  curRows = rows;
  for(const id of [...sel]) if(!links.some(l=>l.id===id)) sel.delete(id);
  const list=$("list");
  if(!rows.length) list.innerHTML='<div class="sub" style="padding:12px 0">이 폴더에 저장된 링크가 없어요.</div>';
  else list.innerHTML=rows.map(itemHtml).join("");
  syncBar();
  syncFBar();
  lazyMount();
}
function syncBar(){
  const n=sel.size, inView=curRows.filter(l=>sel.has(l.id)).length;
  $("selAll").checked = curRows.length>0 && inView===curRows.length;
  $("selAll").indeterminate = inView>0 && inView<curRows.length;
  $("selCnt").textContent = n ? `(${n}개 선택됨)` : "";
  $("bar").style.display = n ? "block" : "none";
  document.body.classList.toggle("hasbar", n>0 || fsel.size>0);
  $("barInfo").textContent = `${n}개 선택됨`;
}

const isShort = (l)=>/\/shorts\//.test(l.url);
function itemHtml(l){
  const yt = l.platform==="youtube" ? youtubeId(l.url) : null;
  const P = PLAT[l.platform]||PLAT.etc;
  const media = l.preview_url
    ? `<div class="embedbox" data-on="1"><video class="vid" controls playsinline preload="none"${l.thumb_url?` poster="${esc(l.thumb_url)}"`:""} src="${esc(l.preview_url)}"></video></div>`
    : yt
    ? `<div class="embedbox"><a class="thumb wide p-youtube${isShort(l)?" short":""}" href="${esc(l.url)}" target="_blank" rel="noopener"><img src="https://img.youtube.com/vi/${esc(yt)}/${isShort(l)?"hqdefault":"mqdefault"}.jpg" alt="" loading="lazy"><span class="play">▶ 재생</span></a></div>`
    : `<div class="embedbox"></div>`;

  const canPlay = !l.preview_url && (!!yt || l.platform==="tiktok");
  return `
  <div class="item${sel.has(l.id)?" sel":""}" data-id="${l.id}">
    <input type="checkbox" class="ck" ${sel.has(l.id)?"checked":""} aria-label="선택">
    <div class="content">
      ${media}
      <div class="row">
        ${mini}
        <span class="badge" style="background:${BADGE_BG[l.platform]||"#667"}">${P.icon} ${P.name}</span>
        <span class="tag st-${l.status}">${STATUS[l.status]||l.status}</span>
        ${l.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}
      </div>
      <a class="u" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title||shortUrl(l.url))}</a>
      ${l.memo?`<div class="sub">${esc(l.memo)}</div>`:""}
      <div class="sub">${new Date(l.created_at).toLocaleDateString("ko-KR")}</div>
      <div class="acts">
        ${canPlay?`<button data-a="play">▶ 재생</button>`:""}
        <button data-a="st">상태</button><button data-a="cat">폴더 이동</button><button data-a="memo">메모</button><button data-a="del" class="bad">삭제</button>
      </div>
    </div>
  </div>`;
}

/* 틱톡: 영상 ID로 앱 안 재생. 짧은 링크(vt.tiktok.com)는 oEmbed로 ID를 알아낸다. */
async function tiktokId(u){
  const m=u.match(/\/video\/(\d{8,})/); if(m) return m[1];
  let cache={}; try{ cache=JSON.parse(localStorage.getItem("ttCache")||"{}"); }catch{}
  if(cache[u]) return cache[u];
  try{
    const r=await fetch("https://www.tiktok.com/oembed?url="+encodeURIComponent(u));
    const j=await r.json();
    const id=j.embed_product_id || ((j.html||"").match(/player\/v1\/(\d+)/)||[])[1];
    if(id){ cache[u]=id; try{ localStorage.setItem("ttCache",JSON.stringify(cache)); }catch{} return id; }
  }catch{}
  return null;
}

/* 영상 붙이기: 유튜브는 썸네일 자리를 영상으로 바꾼다. 틱톡은 ▶ 재생을 눌렀을 때만(틱톡이 삽입을 막아 둔 경우가 많음) */
async function mountEmbed(box,l){
  if(l.platform==="youtube"){
    const id=youtubeId(l.url); if(!id) return;
    box._orig = box.innerHTML; box.dataset.on="1";
    box.innerHTML=`<iframe class="embed${isShort(l)?" tt":""}" src="https://www.youtube-nocookie.com/embed/${esc(id)}?playsinline=1" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  } else if(l.platform==="tiktok"){
    box._orig = box.innerHTML; box.dataset.on="1";
    box.innerHTML=`<div class="sub" style="margin-top:8px">틱톡 영상 불러오는 중…</div>`;
    const id=await tiktokId(l.url);
    box.innerHTML = id
      ? `<iframe class="embed tt" src="https://www.tiktok.com/player/v1/${esc(id)}?embed_from=oembed&music_info=1&description=1&autoplay=1&muted=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe><div class="sub">검은 화면에 틱톡 로고만 보이면 틱톡이 앱 안 재생을 막은 영상이에요. 위 링크를 눌러 열어 주세요.</div>`
      : `<div class="sub" style="margin-top:8px">이 틱톡은 앱 안에서 재생할 수 없어요. 링크를 눌러 열어 주세요.</div>`;
  }
}
function unmountEmbed(box){ box.innerHTML = box._orig || ""; delete box.dataset.on; }
let embedIO = null;
function autoEmbedOn(){ try{ return localStorage.getItem("autoEmbed")!=="0"; }catch{ return true; } }
function lazyMount(){
  if(embedIO){ embedIO.disconnect(); embedIO=null; }
  if(!autoEmbedOn() || !("IntersectionObserver" in window)) return;
  embedIO = new IntersectionObserver((es)=>{
    es.forEach(e=>{
      if(!e.isIntersecting) return;
      embedIO.unobserve(e.target);
      const l=links.find(x=>x.id===e.target.dataset.id), box=e.target.querySelector(".embedbox");
      if(l && box && !box.dataset.on && !box.dataset.off && l.platform==="youtube") mountEmbed(box,l);
    });
  },{rootMargin:"300px"});
  document.querySelectorAll("#list .item").forEach(it=>embedIO.observe(it));
}
$("autoEmbed").checked = autoEmbedOn();
$("autoEmbed").onchange = (e)=>{ try{ localStorage.setItem("autoEmbed", e.target.checked?"1":"0"); }catch{} render(); };

$("list").onclick = async (e)=>{
  const b=e.target.closest("button[data-a]"); if(!b) return;
  const it=b.closest(".item"), id=it.dataset.id, l=links.find(x=>x.id===id);
  const a=b.dataset.a;
  if(a==="play"){
    const box=it.querySelector(".embedbox");
    if(box.dataset.on){ unmountEmbed(box); box.dataset.off="1"; return; }
    delete box.dataset.off;
    await mountEmbed(box,l);
  } else if(a==="st"){
    const nx={new:"working",working:"done",done:"new"}[l.status]||"new";
    await patch(l,{status:nx});
  } else if(a==="del"){
    if(!confirm("이 링크를 삭제할까요?\n(다른 폴더에 있어도 함께 사라져요)")) return;
    const {error}=await sb.from("links").delete().eq("id",id);
    if(error) return toast(error.message); links=links.filter(x=>x.id!==id); render(); toast("삭제했어요.");
  } else if(a==="cat"){
    openCatModal(l);
  } else if(a==="memo"){
    const v=prompt("메모", l.memo||""); if(v===null) return;
    await patch(l,{memo:v.trim()});
  }
};
async function patch(l,fields){
  const {error}=await sb.from("links").update({...fields,updated_at:new Date().toISOString()}).eq("id",l.id);
  if(error) return toast(error.message);
  Object.assign(l,fields); render();
}

async function saveUrls(urls, categories, memo){
  const rows=urls.map(u=>({url:u,platform:platformOf(u),memo:memo||"",categories}));
  // 이미 있는 링크는 카테고리를 합쳐 준다
  const have = links.filter(l=>urls.includes(l.url));
  const fresh = rows.filter(r=>!have.some(h=>h.url===r.url));
  let added=0, merged=0;
  if(fresh.length){
    const {data,error}=await sb.from("links").insert(fresh).select();
    if(error) { toast("저장 실패: "+error.message); return false; }
    added=data.length;
  }
  for(const h of have){
    const merge=[...new Set([...h.categories,...categories])];
    if(merge.length!==h.categories.length){
      const {error}=await sb.from("links").update({categories:merge,updated_at:new Date().toISOString()}).eq("id",h.id);
      if(!error) merged++;
    }
  }
  const dup=urls.length-added;
  toast(`${added}개 저장`+(dup?`, 이미 있던 ${dup}개`+(merged?` (폴더만 추가 ${merged})`:" 건너뜀"):""));
  await loadAll(); return true;
}

/* ---------- 폴더 편집 (이름 · 삭제 · 이동 · 순서 · 선택) ---------- */
async function ensureRows(path){
  let cur="";
  for(const part of path.split("/").filter(Boolean)){
    cur = cur ? cur+"/"+part : part;
    if(!cats.some(c=>c.name===cur)){
      const {data,error}=await sb.from("categories").insert({name:cur,sort:cats.length+1}).select();
      if(!error && data && data[0]) cats.push(data[0]);
    }
  }
}
async function renamePath(oldP, newP){
  if(oldP===newP) return false;
  if(newP.startsWith(oldP+"/")){ toast("자기 안으로는 옮길 수 없어요."); return false; }
  if(cats.some(c=>inPath(c.name,newP))){ toast("같은 이름의 폴더가 이미 있어요."); return false; }
  for(const c of cats.filter(c=>inPath(c.name,oldP))){
    const {error}=await sb.from("categories").update({name:newP+c.name.slice(oldP.length)}).eq("id",c.id);
    if(error){ toast(error.message); return false; }
  }
  for(const l of links.filter(l=>l.categories.some(c=>inPath(c,oldP)))){
    const next=[...new Set(l.categories.map(c=>inPath(c,oldP) ? newP+c.slice(oldP.length) : c))];
    await sb.from("links").update({categories:next}).eq("id",l.id);
  }
  await ensureRows(parentOf(newP));
  return true;
}
async function renameFolder(path, stay){
  const nn=(prompt("폴더 이름 바꾸기", leafOf(path))||"").trim().replace(/\//g,"");
  if(!nn || nn===leafOf(path)) return;
  const par=parentOf(path), np=(par?par+"/":"")+nn;
  if(!await renamePath(path,np)) return;
  await loadAll();
  if(stay) location.hash = encodeURIComponent("f="+np);
  toast(`'${leafOf(path)}' → '${nn}' 으로 바꿨어요.`);
}
async function moveInto(path, newParent){
  const np=(newParent ? newParent+"/" : "")+leafOf(path);
  if(np===path) return;
  if(!await renamePath(path,np)) return;
  await loadAll();
  toast(`'${leafOf(path)}' 폴더를 ${newParent ? `'${newParent}' 안으로` : "최상위로"} 옮겼어요.`);
}
async function placeSibling(path, target, after){
  const np=parentOf(target); let cur=path;
  if(parentOf(path)!==np){
    const nn=(np?np+"/":"")+leafOf(path);
    if(!await renamePath(path,nn)) return;
    cur=nn; await loadAll();
  }
  const sibs=childrenOf(np).filter(x=>x!==cur);
  let at=sibs.indexOf(target); if(at<0) at=sibs.length; if(after) at++;
  sibs.splice(at,0,cur);
  const ups=[];
  sibs.forEach((pp,k)=>{ const r=catRow(pp), v=(k+1)*10; if(r && r.sort!==v) ups.push(sb.from("categories").update({sort:v}).eq("id",r.id)); });
  await Promise.all(ups); await loadAll();
}
async function stepSibling(path, dir){
  const sibs=childrenOf(parentOf(path)), i=sibs.indexOf(path), j=i+dir;
  if(j<0 || j>=sibs.length) return toast("더 옮길 수 없어요.");
  await placeSibling(path, sibs[j], dir>0);
}
async function deleteCats(list, backTo){
  if(!list.length) return;
  const nm = list.length===1 ? `'${list[0].name}' 폴더를` : `선택한 폴더 ${list.length}개를`;
  if(!confirm(`${nm} 삭제할까요?\n하위 폴더도 함께 삭제돼요. 안에 있던 링크는 삭제되지 않아요. (다른 폴더가 없으면 '미분류'가 돼요)`)) return;
  for(const c of list){
    const victims=cats.filter(x=>inPath(x.name,c.name));
    for(const v of victims){
      const {error}=await sb.from("categories").delete().eq("id",v.id);
      if(error) return toast(error.message);
      pick.delete(v.name);
    }
    for(const l of links.filter(l=>l.categories.some(x=>inPath(x,c.name)))){
      await sb.from("links").update({categories:l.categories.filter(x=>!inPath(x,c.name))}).eq("id",l.id);
    }
  }
  fsel.clear(); toast(`폴더 ${list.length}개를 삭제했어요.`);
  if(backTo!==undefined) go(backTo);
  await loadAll();
}
function toggleF(id){ fsel.has(id)?fsel.delete(id):fsel.add(id); render(); }
function gridParent(){ const r=route(); return r.t==="cat" ? r.name : ""; }
function syncFBar(){
  const n=fsel.size, show = n>0 && route().t!=="all" && route().t!=="none";
  $("fbar").style.display = show ? "block" : "none";
  $("fbarInfo").textContent = `폴더 ${n}개 선택됨 · 폴더를 눌러 선택을 바꿔요`;
  document.body.classList.toggle("hasbar", show || sel.size>0);
}
$("fClear").onclick=()=>{ fsel.clear(); render(); };
$("fAll").onclick=()=>{ childrenOf(gridParent()).forEach(pp=>{ const r=catRow(pp); if(r) fsel.add(r.id); }); render(); };
$("fDel").onclick=()=>deleteCats(cats.filter(c=>fsel.has(c.id)));
$("fXls").onclick=()=>{
  const names=cats.filter(c=>fsel.has(c.id)).map(c=>c.name);
  exportRows(links.filter(l=>l.categories.some(x=>names.some(n=>inPath(x,n)))), "폴더선택");
};

function openMovePicker(path){
  const box=$("modalBox");
  const targets=cats.map(c=>c.name).filter(n=>!inPath(n,path) && n!==parentOf(path));
  box.innerHTML=`<b>📂 '${esc(leafOf(path))}' 을(를) 어디로 옮길까요?</b><div class="menu" id="mv"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button id="mCancel">취소</button></div>`;
  const mv=box.querySelector("#mv");
  const add=(label,val)=>{ const b=document.createElement("button"); b.textContent=label; b.onclick=async()=>{ $("modal").classList.add("hide"); await moveInto(path,val); }; mv.append(b); };
  if(parentOf(path)) add("🏠 최상위(홈)로","");
  targets.forEach(n=>add("📁 "+n.split("/").join(" › "), n));
  if(!targets.length && !parentOf(path)) mv.innerHTML='<div class="sub">옮길 수 있는 다른 폴더가 없어요.</div>';
  box.onclick=null;
  box.querySelector("#mCancel").onclick=()=>$("modal").classList.add("hide");
  $("modal").classList.remove("hide");
}
async function openFolderMenu(path){
  if(!catRow(path)){ await ensureRows(path); await loadAll(); }
  const c=catRow(path); if(!c) return;
  const box=$("modalBox");
  box.innerHTML=`<b>📁 ${esc(path.split("/").join(" › "))}</b>
    <div class="menu">
      <button data-m="open">열기</button><button data-m="ren">✏️ 이름 변경</button><button data-m="mv">📂 다른 폴더로 옮기기</button>
      <button data-m="sel">☑️ 선택(체크)</button>
      <button data-m="up">⬆ 앞으로 옮기기</button><button data-m="down">⬇ 뒤로 옮기기</button><button data-m="del" class="bad">🗑 삭제</button>
    </div>`;
  box.onclick=async(e)=>{
    const b=e.target.closest("button[data-m]"); if(!b) return;
    $("modal").classList.add("hide");
    const m=b.dataset.m;
    if(m==="open") go("f="+path);
    else if(m==="ren") await renameFolder(path,false);
    else if(m==="mv") openMovePicker(path);
    else if(m==="sel"){ fsel.add(c.id); render(); }
    else if(m==="up") await stepSibling(path,-1);
    else if(m==="down") await stepSibling(path,1);
    else if(m==="del") await deleteCats([c]);
  };
  $("modal").classList.remove("hide");
}

/* ---- 꾹 누르기: 그냥 떼면 메뉴, 누른 채 움직이면 끌어서 옮기기 ---- */
let drag=null, pressArmed=false;
document.addEventListener("touchmove",(e)=>{ if(drag||pressArmed) e.preventDefault(); },{passive:false});
function clearDropMarks(){
  document.querySelectorAll(".drop-in,.drop-before,.drop-after").forEach(x=>x.classList.remove("drop-in","drop-before","drop-after"));
  $("upZone").classList.remove("over");
}
function startDrag(el, path, e){
  const r=el.getBoundingClientRect();
  const ghost=el.cloneNode(true); ghost.id="ghost"; ghost.classList.remove("armed","dragging");
  ghost.style.width=r.width+"px"; ghost.style.left=r.left+"px"; ghost.style.top=r.top+"px";
  document.body.append(ghost); el.classList.add("dragging");
  const par=parentOf(path), up=$("upZone");
  if(par){ const gp=parentOf(par); up.textContent = gp ? `⬆ 여기에 놓으면 '${leafOf(gp)}' 안으로 (한 단계 위)` : "⬆ 여기에 놓으면 최상위(홈)로 (한 단계 위)"; up.style.display="block"; }
  drag={el,path,ghost,ox:e.clientX-r.left,oy:e.clientY-r.top,target:null,mode:null};
}
function moveDrag(e){
  const d=drag; d.ghost.style.left=(e.clientX-d.ox)+"px"; d.ghost.style.top=(e.clientY-d.oy)+"px";
  if(e.clientY>innerHeight-90) scrollBy(0,14); else if(e.clientY<110 && scrollY>0) scrollBy(0,-14);
  clearDropMarks(); d.target=null; d.mode=null;
  const t=document.elementFromPoint(e.clientX,e.clientY); if(!t) return;
  if(t.closest("#upZone")){ d.mode="up"; $("upZone").classList.add("over"); return; }
  const card=t.closest(".folder[data-path]");
  if(card && card!==d.el){
    const rc=card.getBoundingClientRect(), f=(e.clientX-rc.left)/rc.width;
    d.target=card.dataset.path; d.mode = f<0.25 ? "before" : f>0.75 ? "after" : "in";
    card.classList.add("drop-"+d.mode);
  }
}
async function finishDrag(d){
  d.ghost.remove(); d.el.classList.remove("dragging"); clearDropMarks(); $("upZone").style.display="none";
  if(d.mode==="in") await moveInto(d.path,d.target);
  else if(d.mode==="before" || d.mode==="after") await placeSibling(d.path,d.target,d.mode==="after");
  else if(d.mode==="up") await moveInto(d.path, parentOf(parentOf(d.path)));
}
function cancelDrag(){
  if(!drag) return; drag.ghost.remove(); drag.el.classList.remove("dragging"); clearDropMarks(); $("upZone").style.display="none"; drag=null;
}
function attachPress(el, path, onTap){
  let timer=null, sx=0, sy=0, armed=false, suppress=false;
  const clear=()=>{ clearTimeout(timer); timer=null; };
  el.addEventListener("pointerdown",(e)=>{
    if(e.button>0) return;
    armed=false; sx=e.clientX; sy=e.clientY;
    timer=setTimeout(()=>{ armed=true; pressArmed=true; try{ navigator.vibrate&&navigator.vibrate(25); }catch{} el.classList.add("armed"); },450);
    try{ el.setPointerCapture(e.pointerId); }catch{}
  });
  el.addEventListener("pointermove",(e)=>{
    const dist=Math.hypot(e.clientX-sx,e.clientY-sy);
    if(!armed){ if(timer && dist>10) clear(); return; }
    if(!drag && dist>10) startDrag(el,path,e);
    if(drag) moveDrag(e);
  });
  el.addEventListener("pointerup",async(e)=>{
    clear(); const was=armed; armed=false; pressArmed=false; el.classList.remove("armed");
    if(drag){ const d=drag; drag=null; suppress=true; await finishDrag(d); return; }
    if(was){ suppress=true; openFolderMenu(path); }
  });
  el.addEventListener("pointercancel",()=>{ clear(); armed=false; pressArmed=false; el.classList.remove("armed"); cancelDrag(); });
  el.addEventListener("click",(e)=>{ if(suppress){ suppress=false; e.preventDefault(); return; } onTap(); });
  el.addEventListener("contextmenu",(e)=>{ e.preventDefault(); if(!matchMedia("(pointer:coarse)").matches && path) openFolderMenu(path); });
}

/* ---------- 카테고리 추가 (parent 가 있으면 그 폴더의 하위 폴더) ---------- */
async function addCategory(parent){
  parent = typeof parent==="string" ? parent : "";
  const raw=(prompt(parent ? `'${parent}' 안에 만들 하위 폴더 이름` : "새 카테고리(폴더) 이름\n(하위 폴더는 영화/미드 처럼 / 로 구분해도 돼요)")||"")
    .trim().replace(/\s*\/\s*/g,"/").replace(/^\/+|\/+$/g,"");
  if(!raw) return;
  const full=(parent ? parent+"/" : "")+raw;
  if(cats.some(c=>c.name===full)) return toast("이미 있는 이름이에요.");
  await ensureRows(parentOf(full));
  const {error}=await sb.from("categories").insert({name:full,sort:cats.length+1});
  if(error) return toast(error.message.includes("duplicate")?"이미 있는 이름이에요.":error.message);
  pick.add(full); await loadAll(); toast(`'${full}' 폴더를 만들었어요.`);
}

/* ---------- 엑셀(CSV) 내보내기 ---------- */
function csvCell(v){ v=String(v??""); return /[",\r\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
async function exportRows(rows,label){
  if(!rows.length) return toast("내보낼 링크가 없어요.");
  const head=["카테고리","플랫폼","링크","제목","메모","상태","저장일"];
  const lines=[head.map(csvCell).join(",")];
  rows.forEach(l=>lines.push([
    l.categories.join(" / ")||"미분류",(PLAT[l.platform]||PLAT.etc).name,l.url,l.title,l.memo,STATUS[l.status]||l.status,
    new Date(l.created_at).toLocaleString("ko-KR")].map(csvCell).join(",")));
  const text="﻿"+lines.join("\r\n");
  const d=new Date(), ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const name=`링크보관함_${String(label).replace(/[\\/:*?"<>|›]+/g,"_")}_${ds}.csv`;
  const file=new File([text],name,{type:"text/csv"});
  try{
    if(matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name}); return;   // 폰: 공유창에서 드라이브·카톡 등에 저장
    }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name;
  document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(`${rows.length}개를 ${name} 로 내보냈어요.`);
}
$("btnExport").onclick=()=>{ const r=route(); exportRows(folderRows(r),folderLabel(r)); };
$("btnExportAll").onclick=()=>exportRows(links,"전체");

init();
